[package]
name = "retypr"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3"
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }  # окно настроек (egui)
rfd = { version = "0.15", default-features = false }  # диалог выбора файла
tray-icon = "0.19"   # иконка в трее + меню (muda внутри)
winreg = "0.52"      # автозапуск (HKCU\\...\\Run)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Не-Windows пока работает через rdev + enigo (best effort)
[target.'cfg(not(windows))'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }
enigo = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"   # иконка, манифест и версия в exe

[profile.release]
opt-level = 3
lto = true
strip = true
