[package]
name = "retypr"
version = "0.2.6"
edition = "2021"

[[bin]]
name = "Retypr"          # the executable is Retypr.exe (capital R)
path = "src/main.rs"

[dependencies]
arboard = "3"
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Windows and macOS: settings window, tray / menu bar icon, dictionary downloads
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }  # settings window (egui)
ureq = "2"   # dictionary download in Settings
rfd = { version = "0.15", default-features = false }  # file picker dialog
tray-icon = "0.19"   # tray icon / menu bar icon + menu (muda inside)

[target.'cfg(unix)'.dependencies]
libc = "0.2"         # flock for the single-instance lock; pthread_main_np on macOS

[target.'cfg(windows)'.dependencies]
single-instance = "0.3"   # named mutex
winreg = "0.52"      # start with Windows (HKCU\...\Run)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: native backend (event tap, input sources, CGEvent typing) and the main event loop for the menu bar icon
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
dispatch = "0.2"     # hop onto the main queue (Text Input Sources must be used on the main thread)
tao = "0.30"         # event loop that tray-icon needs on macOS

# Linux and the rest: best effort (rdev + enigo)
[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }
enigo = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"   # icon, manifest and version in the exe

[profile.release]
opt-level = 3
lto = true
strip = true
